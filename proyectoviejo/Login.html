<body>
  <div class="login-wrap">
    <section class="login-brand">
      <div>
        <img src="https://i.postimg.cc/fyMcjMcn/logo-uap.png" alt="Logo UAP">
        <h1>Recursos Áulicos UAP</h1>
        <p>Sistema interno de gestión, reservas, oficina, caja y alumnos becarios.</p>
      </div>
      <div class="login-footer">Universidad Adventista del Plata</div>
    </section>
    <section class="login-form">
      <h2>Ingresar</h2>
      <p class="sub">Usá tu usuario y contraseña para entrar al sistema.</p>
      <label>Usuario</label>
      <input type="text" id="usuario" autocomplete="username" placeholder="Ej: admin">
      <label>Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="Contraseña">
      <button id="btn-login" onclick="ingresar()">Entrar al sistema</button>
      <div class="error" id="error-login"></div>
      <p class="nota">Si la sesión vence, el sistema te va a pedir ingresar nuevamente.</p>
    </section>
  </div>
  <script>
    const PAGE_DESTINO = "<?= pageDestino ?>";
    function mostrarError(msg) {
      const el = document.getElementById("error-login");
      el.innerText = msg;
      el.style.display = "block";
    }
    function ingresar() {
      const usuario = document.getElementById("usuario").value;
      const password = document.getElementById("password").value;
      const btn = document.getElementById("btn-login");
      document.getElementById("error-login").style.display = "none";
      if (!usuario || !password) {
        mostrarError("Completá usuario y contraseña.");
        return;
      }
      btn.disabled = true;
      btn.innerText = "Ingresando...";
      google.script.run
        .withSuccessHandler(res => {
          btn.disabled = false;
          btn.innerText = "Entrar al sistema";
          if (!res || !res.ok) {
            mostrarError(res && res.mensaje ? res.mensaje : "No se pudo iniciar sesión.");
            return;
          }
          localStorage.setItem("uap_token", res.token);
          localStorage.setItem("uap_usuario", res.usuario);
          localStorage.setItem("uap_nombre", res.nombre);
          localStorage.setItem("uap_rol", res.rol);
          window.top.location.href = res.url;
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.innerText = "Entrar al sistema";
          mostrarError(err.message || "Error al iniciar sesión.");
        })
        .validarLogin(usuario, password, PAGE_DESTINO);
    }
    document.addEventListener("keydown", e => {
      if (e.key === "Enter") ingresar();
    });
  </script>
</body>
