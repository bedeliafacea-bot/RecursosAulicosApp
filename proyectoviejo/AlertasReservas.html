<script>
let intervaloGlobalReservas = null;
let alertasMostradasGlobal = {};

function iniciarAlertasGlobalesReservas() {
  pedirPermisoNotificacionesGlobal();

  if (intervaloGlobalReservas) {
    clearInterval(intervaloGlobalReservas);
  }

  revisarAlertasGlobales();

  intervaloGlobalReservas = setInterval(() => {
    revisarAlertasGlobales();
  }, 60000);
}

function pedirPermisoNotificacionesGlobal() {
  if (!("Notification" in window)) return;

  if (Notification.permission === "default") {
    Notification.requestPermission();
  }
}

function revisarAlertasGlobales() {
  google.script.run.withSuccessHandler(reservas => {

    if (!reservas || reservas.length === 0) return;

    const ahora = new Date();
    const diaActual = obtenerDiaActualGlobal();

    reservas.forEach(reserva => {

      if (String(reserva.estado).toLowerCase() !== "pendiente") return;

      if (normalizarTextoGlobal(reserva.dia) !== normalizarTextoGlobal(diaActual)) return;

      const minutos = calcularMinutosGlobal(reserva.horaInicio, ahora);

      if ([15,10,5].includes(minutos)) {

        const clave = `${reserva.filaOriginal}-${minutos}`;

        if (!alertasMostradasGlobal[clave]) {

          alertasMostradasGlobal[clave] = true;

          const mensaje =
            `${reserva.profesor} - ${reserva.aula} / ${reserva.recurso} comienza en ${minutos} minutos`;

          mostrarModalGlobalReserva(mensaje);
        }
      }
    });

  }).obtenerReservasPorDia(diaActualRealGlobal());
}

function calcularMinutosGlobal(hora, ahora) {
  const partes = String(hora).split(":");

  const fecha = new Date();

  fecha.setHours(Number(partes[0]));
  fecha.setMinutes(Number(partes[1]));
  fecha.setSeconds(0);

  return Math.round((fecha.getTime() - ahora.getTime()) / 60000);
}

function mostrarModalGlobalReserva(mensaje) {

  let modal = document.getElementById("modal-global-reserva");

  if (!modal) {

    modal = document.createElement("div");

    modal.id = "modal-global-reserva";

    modal.innerHTML = `
      <div class="modal-global-contenido">
        <div class="modal-global-icono">🔔</div>

        <h2>Reserva próxima</h2>

        <p id="texto-modal-global"></p>

        <button onclick="cerrarModalGlobalReserva()">
          Entendido
        </button>
      </div>
    `;

    document.body.appendChild(modal);
  }

  document.getElementById("texto-modal-global").innerText = mensaje;

  modal.style.display = "flex";
}

function cerrarModalGlobalReserva() {
  const modal = document.getElementById("modal-global-reserva");

  if (modal) {
    modal.style.display = "none";
  }
}

function obtenerDiaActualGlobal() {
  const dias = [
    "Domingo",
    "Lunes",
    "Martes",
    "Miércoles",
    "Jueves",
    "Viernes",
    "Sábado"
  ];

  return dias[new Date().getDay()];
}

function diaActualRealGlobal() {
  return obtenerDiaActualGlobal();
}

function normalizarTextoGlobal(txt) {
  return String(txt || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

window.addEventListener("load", () => {
  iniciarAlertasGlobalesReservas();
});
</script>
