<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Styles'); ?>
</head>

<body onload="cargarCumpleanos()">
  <div class="main-header no-print-zone">
    <div class="header-con-logo">
      <img src="https://i.postimg.cc/fyMcjMcn/logo-uap.png" class="logo-titulo" alt="Logo UAP">
      <h1>Cumpleaños Próximos</h1>
    </div>
  </div>

  <div class="nav-bar no-print-zone">
    <a href="<?= ScriptApp.getService().getUrl(); ?>" style="background:#5a6268;">🏠 VOLVER AL INICIO</a>
    <button onclick="cargarCumpleanos()">🔄 ACTUALIZAR</button>
  </div>

  <div class="no-print-zone">
    <div class="card-info" style="max-width:600px;margin:0 auto;">
      <h3>🎉 Cumpleaños en los próximos 15 días</h3>
      <ul id="lista-cumpleanos" style="list-style:none;padding:0;margin:0;color:#333;">
        <li style="text-align:center;">⏳ Cargando...</li>
      </ul>
    </div>
  </div>

<script>
function cargarCumpleanos() {
  const lista = document.getElementById('lista-cumpleanos');
  lista.innerHTML = '<li style="text-align:center;">⏳ Cargando...</li>';

  google.script.run.withSuccessHandler(cumpleanos => {
    if (!cumpleanos || cumpleanos.length === 0) {
      lista.innerHTML = '<li style="text-align:center;color:#666;">No hay cumpleaños próximos</li>';
      return;
    }

    lista.innerHTML = cumpleanos.map(c => {
      const nombre = c.nombre
        .split(' ')
        .map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase())
        .join(' ');

      return `
        <li style="padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;">
          <span>${nombre}</span>
          <b style="color:#b71c1c;">${c.fecha}</b>
        </li>`;
    }).join('');
  }).obtenerCumpleanosProximos();
}
</script>
</body>
</html>
